<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thymeleaf 반복문</title>


</head>
<body>

    <h2>Thymeleaf 반복문</h2>
    <!-- 0 1 2 3 4 -->
    <div th:each="i:${#numbers.sequence(0, 4)}" th:text="${i}"></div>

    <h3>2. 리스트 반복</h3>

    <!-- 향상된 for 문과 매우 흡사한 구성 for(String fruit:fruitList) 이거 와 매우 흡사 -->
    <div th:each="fruit, status:${fruitList}">
        <span th:text="${fruit}">파인애플</span>
        <span th:text="|${status.index} ${status.count} ${status.first} ${status.last}|"></span>
    </div>

    <h3>3. 복잡한 리스트 반복</h3>

    <table border="1">
        <thead>
            <tr>
                <th>이름</th>
                <th>나이</th>
                <th>취미</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user:${userList}">
                <td th:text="${user.name}">전수홍</td>
                <td th:text="${user.age}">26</td>
                <td th:text="${user.hobby}">농구</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
